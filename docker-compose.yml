services:
  postgres:
    image: postgres:16-alpine
    container_name: shiftsync-postgres
    environment:
      POSTGRES_DB: shiftsync
      POSTGRES_USER: shiftsync
      POSTGRES_PASSWORD: shiftsync
    ports:
      - "5432:5432"
    volumes:
      - shiftsync_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiftsync -d shiftsync"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  shiftsync_pgdata: