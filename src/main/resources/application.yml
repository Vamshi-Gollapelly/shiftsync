spring:
  application:
    name: shiftsync

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shiftsync}
    username: ${DB_USERNAME:shiftsync}
    password: ${DB_PASSWORD:shiftsync}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:change-this-in-every-environment-it-must-be-at-least-256-bits-long}
  access-token-ttl-minutes: ${JWT_ACCESS_TTL_MIN:15}
  refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{traceId:-}] %-5level %logger{36} - %msg%n"
  level:
    com.shiftsync: INFO

springdoc:
  swagger-ui:
    path: /docs